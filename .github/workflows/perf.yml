name: Performance gate

# Runs a reduced benchmark on the PR and on its base, on the same runner,
# and fails if the PR is more than 10% slower on any scenario. Hosted
# runners are noisy and drift over a job, so both benchmark binaries are
# built first and then run alternately, several rounds each, with enough
# jobs per run to last a few seconds; the median run of each side counts.
# The reference numbers in docs/PLAN.md §8.2 come from the release hardware,
# not from here.
on:
  pull_request:
    paths:
      - "go.mod"
      - "*.go"
      - "driver/**"
      - "hoppermigrate/**"
      - "cmd/hopperbench/**"
      - ".github/workflows/perf.yml"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hopper
          POSTGRES_PASSWORD: hopper
          POSTGRES_DB: hopper_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hopper -d hopper_bench"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://hopper:hopper@localhost:5432/hopper_bench?sslmode=disable
      SCENARIOS: throughput,insert,copy
      ROUNDS: "7"
      JOBS: "60000"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build both benchmark binaries
        run: |
          go build -o "$RUNNER_TEMP/bench-head" ./cmd/hopperbench
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          (cd "$RUNNER_TEMP/base" && go build -o "$RUNNER_TEMP/bench-base" ./cmd/hopperbench)
      - name: Benchmark base and PR alternately
        run: |
          for i in $(seq "$ROUNDS"); do
            "$RUNNER_TEMP/bench-base" -database-url "$DATABASE_URL" -scenarios "$SCENARIOS" -jobs "$JOBS" -schema "base_$i" >> base.jsonl
            "$RUNNER_TEMP/bench-head" -database-url "$DATABASE_URL" -scenarios "$SCENARIOS" -jobs "$JOBS" -schema "head_$i" >> head.jsonl
          done
          echo "== base"; cat base.jsonl
          echo "== head"; cat head.jsonl
      - name: Compare
        run: |
          "$RUNNER_TEMP/bench-head" -compare base.jsonl,head.jsonl -threshold 0.10

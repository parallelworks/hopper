name: Performance gate

# Runs a reduced benchmark on the PR and on its base, on the same runner,
# and fails if the PR is more than 10% slower on any scenario. Hosted
# runners are noisy and drift over a job, so both benchmark binaries are
# built first and then run alternately, scenario by scenario, for several
# rounds. The second of two back-to-back runs is measurably slower than the
# first, so the side that runs first swaps every round and each side runs
# first in half the rounds (ROUNDS must be even). Noise only ever slows a
# run down, so the faster half of each side's runs, averaged, is what is
# compared. Each run drains 300,000 jobs
# (about ten seconds on a runner): a shorter drain measures start-up
# effects, such as the leader's first statistics refresh, rather than the
# hot paths. The workflow scenarios, whose jobs each pass through the
# finalize tail and dependency promotion (and, in workflow-outputs, record
# and read their dependencies' outputs), drain 100,000 (ten thousand
# workflows), about as long. The reference numbers in
# docs/PLAN.md §8.2 come from the release hardware, not from here.
on:
  pull_request:
    paths:
      - "go.mod"
      - "*.go"
      - "driver/**"
      - "hoppermigrate/**"
      - "cmd/hopperbench/**"
      - ".github/workflows/perf.yml"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

# Naming the shell adds pipefail, which the default shell leaves off.
defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hopper
          POSTGRES_PASSWORD: hopper
          POSTGRES_DB: hopper_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hopper -d hopper_bench"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://hopper:hopper@localhost:5432/hopper_bench?sslmode=disable
      SCENARIOS: throughput,insert,copy,workflow,workflow-outputs
      ROUNDS: "6"
      JOBS: "300000"
      WORKFLOW_JOBS: "100000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build both benchmark binaries
        # The branch name reaches the script as data, not as script text.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          go build -o "$RUNNER_TEMP/bench-head" ./cmd/hopperbench
          git worktree add "$RUNNER_TEMP/base" "origin/$BASE_REF"
          (cd "$RUNNER_TEMP/base" && go build -o "$RUNNER_TEMP/bench-base" ./cmd/hopperbench)
      - name: Benchmark base and PR alternately
        run: |
          if (( ROUNDS % 2 )); then echo "ROUNDS must be even" >&2; exit 1; fi
          for i in $(seq "$ROUNDS"); do
            order="base head"
            if (( i % 2 == 0 )); then order="head base"; fi
            for s in ${SCENARIOS//,/ }; do
              jobs=$JOBS
              case "$s" in workflow*) jobs=$WORKFLOW_JOBS;; esac
              for side in $order; do
                "$RUNNER_TEMP/bench-$side" -database-url "$DATABASE_URL" -scenarios "$s" -jobs "$jobs" -schema "${side}_$i" >> "$side.jsonl"
              done
            done
          done
          echo "== base"; cat base.jsonl
          echo "== head"; cat head.jsonl
      - name: Compare
        run: |
          "$RUNNER_TEMP/bench-head" -compare base.jsonl,head.jsonl -threshold 0.10

name: Release

# release-please keeps a release PR open against canary that accumulates
# the next version's changelog from the squash-merged Conventional Commit
# titles. Merging that PR tags the core module (v1.2.3) and publishes the
# GitHub release; this workflow then tags the sub-modules on the same
# commit (hopperotel/v1.2.3, hopperui/v1.2.3) and goreleaser attaches the
# CLI binaries to the release. See docs/releasing.md.
#
# Everything runs with the default GITHUB_TOKEN. GitHub does not start
# workflows for pull requests that token opened, so after release-please
# has created or updated its PR, this workflow dispatches CI on the PR's
# branch itself; a workflow_dispatch run is the documented exception.
on:
  push:
    branches: [canary]

# Permissions are granted per job: only release-please needs to open the PR
# and dispatch CI, and only goreleaser needs to upload to the release.
permissions: {}

# Naming the shell adds pipefail, which the default shell leaves off.
defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          target-branch: canary
      - name: Run CI on the release PR
        # The env block is evaluated even when the step is skipped, so the
        # PR JSON is parsed in the shell rather than with fromJSON here.
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
        run: gh workflow run ci.yml --ref "$(jq -r .headBranchName <<<"$PR")"

  tags-and-binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Kept: the tagging step below pushes with this token.
          persist-credentials: true
      - run: git fetch --force --tags
      - name: Tag the sub-modules at the same version
        # release-please manages one package, the core module, and rewrites
        # the sub-modules' requirement on it (x-release-please-version in
        # their go.mod). Their tags are added here so that all three modules
        # resolve at one version.
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for m in hopperotel hopperui; do
            git tag -a "$m/$TAG" "$TAG" -m "$m $TAG"
          done
          git push origin "hopperotel/$TAG" "hopperui/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release binaries are built from source alone, never from a build
          # cache that an earlier run left behind.
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The sub-module tags sit on the same commit; name the release's tag.
          GORELEASER_CURRENT_TAG: ${{ needs.release-please.outputs.tag_name }}

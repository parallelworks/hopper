name: Release

# release-please keeps a release PR open against canary that accumulates
# the next version's changelog from the squash-merged Conventional Commit
# titles. Merging that PR tags the three modules at one version (v1.2.3,
# hopperotel/v1.2.3, hopperui/v1.2.3) and publishes the GitHub release;
# goreleaser then attaches the CLI binaries to it. See docs/releasing.md.
#
# Everything runs with the default GITHUB_TOKEN. GitHub does not start
# workflows for pull requests that token opened, so after release-please
# has created or updated its PR, this workflow dispatches CI on the PR's
# branch itself; a workflow_dispatch run is the documented exception.
on:
  push:
    branches: [canary]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: canary
      - name: Run CI on the release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --ref "$BRANCH"

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The sub-module tags sit on the same commit; name the release's tag.
          GORELEASER_CURRENT_TAG: ${{ needs.release-please.outputs.tag_name }}

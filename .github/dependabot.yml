version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools"]
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(deps)" }
